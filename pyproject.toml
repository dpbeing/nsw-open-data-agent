[project]
name = "nsw-open-data-agent"
version = "0.1.0"
description = "AI agent for NSW rental bonds"
readme = "README.md"
authors = [
    { name = "Deep Mehta", email = "dpbeing@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.3.1",
    "ollama>=0.6.3",
    "openai>=3.42.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyspark==4.3.0",
    "streamlit>=1.66.1",
]

#[project.scripts]
#nsw-open-data-agent = "nsw_open_data_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"
module-root = "src"
